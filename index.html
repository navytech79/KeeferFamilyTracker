<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KinP2P - Private Family Tracker</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0f172a;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .safe-bottom {
      padding-bottom: max(1.75rem, env(safe-area-inset-bottom, 24px));
    }
    .glassmorphism {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .pulse-ring {
      animation: pulsate 2s infinite ease-out;
    }
    @keyframes pulsate {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }
  </style>
</head>
<body class="text-slate-100 flex flex-col justify-between font-sans antialiased">

  <!-- Interactive Map Canvas -->
  <div id="map"></div>

  <!-- Top Floating Header -->
  <header class="relative z-10 p-4 flex items-center justify-between pointer-events-none">
    <div class="glassmorphism rounded-2xl px-4 py-2.5 flex items-center gap-3 shadow-2xl pointer-events-auto">
      <span id="conn-dot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span>
      <div>
        <div class="flex items-center gap-1.5">
          <span class="font-bold text-sm tracking-wide">KinP2P</span>
          <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded font-mono font-medium border border-emerald-500/30">E2EE</span>
        </div>
        <div id="conn-status" class="text-xs text-slate-400">Initializing mesh...</div>
      </div>
    </div>

    <div class="flex items-center gap-2 pointer-events-auto">
      <button onclick="shareInvite()" class="glassmorphism hover:bg-slate-800 p-2.5 rounded-xl shadow-lg border border-slate-700/60 active:scale-95 transition-transform" title="Invite Family">
        <i data-lucide="share-2" class="w-5 h-5 text-indigo-400"></i>
      </button>
      <button onclick="toggleBroadcast()" id="broadcast-btn" class="glassmorphism bg-emerald-500/20 border-emerald-500/40 p-2.5 rounded-xl shadow-lg active:scale-95 transition-transform" title="GPS Broadcast">
        <i data-lucide="radio" class="w-5 h-5 text-emerald-400"></i>
      </button>
      <button onclick="openSettings()" class="glassmorphism hover:bg-slate-800 p-2.5 rounded-xl shadow-lg border border-slate-700/60 active:scale-95 transition-transform" title="Settings">
        <i data-lucide="settings" class="w-5 h-5 text-slate-300"></i>
      </button>
    </div>
  </header>

  <!-- Notification Banner -->
  <div id="alert-banner" class="hidden relative z-20 mx-4 -mt-2 p-3 bg-rose-600/90 text-white rounded-xl shadow-lg flex items-center gap-2 text-xs">
    <i data-lucide="alert-triangle" class="w-5 h-5 shrink-0"></i>
    <span id="alert-text" class="flex-1"></span>
    <button onclick="document.getElementById('alert-banner').classList.add('hidden')" class="p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
  </div>

  <!-- Floating Map Controls -->
  <div class="absolute right-4 bottom-36 z-10 flex flex-col gap-2.5 pointer-events-auto">
    <button onclick="recenterMap()" class="glassmorphism hover:bg-slate-800 p-3 rounded-xl shadow-xl active:scale-95 transition-transform text-cyan-400" title="Locate Me">
      <i data-lucide="crosshair" class="w-6 h-6"></i>
    </button>
    <button onclick="fitAllMarkers()" class="glassmorphism hover:bg-slate-800 p-3 rounded-xl shadow-xl active:scale-95 transition-transform text-slate-300" title="Fit All Family">
      <i data-lucide="users" class="w-6 h-6"></i>
    </button>
  </div>

  <!-- Bottom Drawer: Family Circle -->
  <footer class="relative z-10 glassmorphism rounded-t-3xl shadow-2xl safe-bottom pointer-events-auto border-t border-slate-700/60">
    <div onclick="toggleDrawer()" class="py-2.5 flex justify-center cursor-pointer">
      <div class="w-12 h-1.5 bg-slate-600/70 rounded-full"></div>
    </div>

    <div class="px-5 pb-2">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
          <span class="text-xs font-semibold tracking-wider uppercase text-slate-400">Family Circle</span>
          <span id="member-count" class="text-xs bg-slate-800 border border-slate-700 px-2 py-0.5 rounded-full text-indigo-300 font-mono">1 active</span>
        </div>
        <button onclick="toggleDrawer()" id="drawer-toggle-btn" class="text-slate-400 p-1 hover:text-white">
          <i data-lucide="chevron-up" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Peer Cards Container -->
      <div id="members-list" class="space-y-2 max-h-48 overflow-y-auto pr-1 transition-all">
        <!-- Self and peers populated dynamically -->
      </div>
    </div>
  </footer>

  <!-- Setup Modal -->
  <div id="setup-modal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glassmorphism max-w-sm w-full p-6 rounded-3xl shadow-2xl border border-slate-700">
      <h2 class="text-xl font-bold mb-1 flex items-center gap-2">
        <i data-lucide="lock" class="w-5 h-5 text-indigo-400"></i>
        Private Circle Setup
      </h2>
      <p class="text-xs text-slate-400 mb-5">Family members must use the exact same Circle Name & Passphrase to discover each other and decrypt GPS data.</p>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Your Name</label>
          <input type="text" id="input-name" placeholder="e.g. Dad" maxlength="15" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Family Circle Name (Room ID)</label>
          <input type="text" id="input-room" placeholder="keefer-family" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Shared Family Passphrase (E2EE)</label>
          <input type="password" id="input-key" placeholder="Enter shared family secret" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <button onclick="saveSetup()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white py-3 rounded-xl font-semibold text-sm shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 mt-2">
          <span>Connect Circle</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const PEER_SLOTS = 8; // Supports circles up to 8 members
    const state = {
      name: localStorage.getItem('kin_name') || '',
      room: (localStorage.getItem('kin_room') || '').toLowerCase().replace(/[^a-z0-9_-]/g, ''),
      key: localStorage.getItem('kin_key') || '',
      cryptoKey: null,
      peer: null,
      peerId: null,
      assignedSlot: -1,
      connections: new Map(),
      peersData: new Map(),
      myCoords: null,
      myAccuracy: 0,
      mySpeed: 0,
      myBattery: 100,
      watchId: null,
      broadcastActive: true,
      drawerExpanded: false
    };

    let map, markers = {}, accuracyHalos = {};

    function initIcons() {
      lucide.createIcons();
    }

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([28.66, -81.36], 13);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      map.on('click', () => {
        if (state.drawerExpanded) toggleDrawer();
      });
    }

    // Cryptographic derivation: PBKDF2 + AES-GCM 256
    async function deriveKey(passphrase) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(passphrase),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: enc.encode("KinP2P-Salt-Keefer-2026"),
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptPayload(dataObj) {
      if (!state.cryptoKey) return null;
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(JSON.stringify(dataObj));
      const ciphertext = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        state.cryptoKey,
        encoded
      );
      return {
        iv: Array.from(iv),
        payload: Array.from(new Uint8Array(ciphertext))
      };
    }

    async function decryptPayload(encryptedObj) {
      if (!state.cryptoKey || !encryptedObj.iv || !encryptedObj.payload) return null;
      try {
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: new Uint8Array(encryptedObj.iv) },
          state.cryptoKey,
          new Uint8Array(encryptedObj.payload)
        );
        return JSON.parse(new TextDecoder().decode(decrypted));
      } catch {
        return null;
      }
    }

    // Hardware GPS Watcher
    function startGPS() {
      if (!("geolocation" in navigator)) {
        showError("Geolocation is not supported by your browser.");
        return;
      }

      state.watchId = navigator.geolocation.watchPosition(
        (pos) => {
          hideError();
          const { latitude, longitude, accuracy, speed } = pos.coords;
          state.myCoords = [latitude, longitude];
          state.myAccuracy = Math.round(accuracy);
          state.mySpeed = speed ? Math.round(speed * 2.23694) : 0;

          updateSelfMarker();
          broadcastLocation();
        },
        (err) => {
          showError(`GPS: ${err.message}`);
        },
        { enableHighAccuracy: true, maximumAge: 4000, timeout: 12000 }
      );

      if (navigator.getBattery) {
        navigator.getBattery().then(bat => {
          state.myBattery = Math.round(bat.level * 100);
          bat.addEventListener('levelchange', () => {
            state.myBattery = Math.round(bat.level * 100);
            broadcastLocation();
          });
        }).catch(() => {});
      }
    }

    function updateSelfMarker() {
      if (!state.myCoords) return;
      const id = 'self';

      if (!markers[id]) {
        const customIcon = L.divIcon({
          className: 'relative',
          html: `
            <div class="relative flex items-center justify-center">
              <div class="absolute w-10 h-10 rounded-full bg-indigo-500/30 pulse-ring"></div>
              <div class="w-8 h-8 rounded-full bg-indigo-600 border-2 border-white shadow-lg flex items-center justify-center text-xs font-bold text-white uppercase">${state.name.charAt(0)}</div>
            </div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        markers[id] = L.marker(state.myCoords, { icon: customIcon }).addTo(map);
        accuracyHalos[id] = L.circle(state.myCoords, {
          radius: state.myAccuracy,
          color: '#6366f1',
          weight: 1,
          fillColor: '#818cf8',
          fillOpacity: 0.15
        }).addTo(map);

        map.setView(state.myCoords, 15);
      } else {
        markers[id].setLatLng(state.myCoords);
        accuracyHalos[id].setLatLng(state.myCoords);
        accuracyHalos[id].setRadius(state.myAccuracy);
      }
      renderMemberList();
    }

    // Deterministic PeerJS Mesh Initialization with NAT Traversal
    async function initP2P() {
      state.cryptoKey = await deriveKey(state.key);
      tryClaimSlot(0);
    }

    function tryClaimSlot(slotIndex) {
      if (slotIndex >= PEER_SLOTS) {
        showError("Family circle room is currently full (max 8 members).");
        return;
      }

      const targetId = `kin-${state.room}-${slotIndex}`;
      const peer = new Peer(targetId, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        state.peer = peer;
        state.peerId = id;
        state.assignedSlot = slotIndex;

        document.getElementById('conn-dot').className = 'w-3 h-3 rounded-full bg-emerald-500';
        document.getElementById('conn-status').innerText = `${state.room} (#${slotIndex + 1})`;

        connectMesh();
        setInterval(connectMesh, 8000); // Periodic sweep to bridge new joins
        setInterval(pingConnections, 10000); // Prevent socket drops
      });

      peer.on('connection', (conn) => {
        setupConn(conn);
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          peer.destroy();
          tryClaimSlot(slotIndex + 1); // Try next member slot
        } else {
          console.warn('P2P Status:', err);
        }
      });
    }

    function connectMesh() {
      for (let i = 0; i < PEER_SLOTS; i++) {
        if (i === state.assignedSlot) continue;
        const targetId = `kin-${state.room}-${i}`;
        if (!state.connections.has(targetId)) {
          const conn = state.peer.connect(targetId, { reliable: true });
          setupConn(conn);
        }
      }
    }

    function setupConn(conn) {
      conn.on('open', () => {
        state.connections.set(conn.peer, conn);
        broadcastLocation();
        updateMemberCount();
      });

      conn.on('data', async (encData) => {
        if (encData === 'ping') return;
        const payload = await decryptPayload(encData);
        if (payload) {
          handlePeerLocation(conn.peer, payload);
        }
      });

      conn.on('close', () => {
        state.connections.delete(conn.peer);
        removePeer(conn.peer);
        updateMemberCount();
      });

      conn.on('error', () => {
        state.connections.delete(conn.peer);
      });
    }

    function pingConnections() {
      state.connections.forEach(conn => {
        if (conn.open) conn.send('ping');
      });
    }

    async function broadcastLocation() {
      if (!state.broadcastActive || !state.myCoords || !state.cryptoKey) return;

      const payload = {
        name: state.name,
        coords: state.myCoords,
        accuracy: state.myAccuracy,
        speed: state.mySpeed,
        battery: state.myBattery,
        timestamp: Date.now()
      };

      const encrypted = await encryptPayload(payload);
      state.connections.forEach((conn) => {
        if (conn.open) conn.send(encrypted);
      });
    }

    function handlePeerLocation(peerId, data) {
      state.peersData.set(peerId, data);

      if (!markers[peerId]) {
        const customIcon = L.divIcon({
          className: 'relative',
          html: `
            <div class="relative flex items-center justify-center">
              <div class="w-8 h-8 rounded-full bg-emerald-600 border-2 border-white shadow-lg flex items-center justify-center text-xs font-bold text-white uppercase">${data.name.charAt(0)}</div>
            </div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        markers[peerId] = L.marker(data.coords, { icon: customIcon }).addTo(map);
        accuracyHalos[peerId] = L.circle(data.coords, {
          radius: data.accuracy || 15,
          color: '#10b981',
          weight: 1,
          fillColor: '#34d399',
          fillOpacity: 0.15
        }).addTo(map);
      } else {
        markers[peerId].setLatLng(data.coords);
        accuracyHalos[peerId].setLatLng(data.coords);
        accuracyHalos[peerId].setRadius(data.accuracy || 15);
      }

      renderMemberList();
    }

    function removePeer(peerId) {
      if (markers[peerId]) {
        map.removeLayer(markers[peerId]);
        delete markers[peerId];
      }
      if (accuracyHalos[peerId]) {
        map.removeLayer(accuracyHalos[peerId]);
        delete accuracyHalos[peerId];
      }
      state.peersData.delete(peerId);
      renderMemberList();
    }

    function renderMemberList() {
      const list = document.getElementById('members-list');
      list.innerHTML = '';

      // Self Item
      const selfItem = document.createElement('div');
      selfItem.className = 'glassmorphism p-3 rounded-2xl flex items-center justify-between border border-indigo-500/30';
      selfItem.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs uppercase text-white">${state.name.charAt(0)}</div>
          <div>
            <div class="text-xs font-semibold text-white">${state.name} <span class="text-[10px] text-slate-400 font-normal">(You)</span></div>
            <div class="text-[10px] text-slate-400 font-mono">${state.mySpeed} mph • GPS ±${state.myAccuracy}m</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-mono text-slate-300">${state.myBattery}%</span>
          <button onclick="recenterMap()" class="p-1.5 text-slate-400 hover:text-white"><i data-lucide="locate" class="w-4 h-4"></i></button>
        </div>
      `;
      list.appendChild(selfItem);

      // Connected Peers
      state.peersData.forEach((peer, peerId) => {
        const item = document.createElement('div');
        item.className = 'glassmorphism p-3 rounded-2xl flex items-center justify-between border border-slate-700/60';
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-xs uppercase text-white">${peer.name.charAt(0)}</div>
            <div>
              <div class="text-xs font-semibold text-white">${peer.name}</div>
              <div class="text-[10px] text-slate-400 font-mono">${peer.speed || 0} mph • GPS ±${peer.accuracy}m</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-mono text-slate-300">${peer.battery || '--'}%</span>
            <button onclick="zoomToPeer('${peerId}')" class="p-1.5 text-slate-400 hover:text-white"><i data-lucide="locate" class="w-4 h-4"></i></button>
          </div>
        `;
        list.appendChild(item);
      });

      initIcons();
    }

    function zoomToPeer(peerId) {
      const peer = state.peersData.get(peerId);
      if (peer && peer.coords) {
        map.flyTo(peer.coords, 16);
      }
    }

    function recenterMap() {
      if (state.myCoords) {
        map.flyTo(state.myCoords, 16);
      }
    }

    function fitAllMarkers() {
      const allPoints = [];
      if (state.myCoords) allPoints.push(state.myCoords);
      state.peersData.forEach(p => {
        if (p.coords) allPoints.push(p.coords);
      });
      if (allPoints.length > 0) {
        map.fitBounds(L.latLngBounds(allPoints), { padding: [50, 50] });
      }
    }

    function updateMemberCount() {
      const activePeers = state.peersData.size;
      document.getElementById('member-count').innerText = `${1 + activePeers} active`;
    }

    function toggleBroadcast() {
      state.broadcastActive = !state.broadcastActive;
      const btn = document.getElementById('broadcast-btn');
      if (state.broadcastActive) {
        btn.className = 'glassmorphism bg-emerald-500/20 border-emerald-500/40 p-2.5 rounded-xl shadow-lg active:scale-95 transition-transform';
        broadcastLocation();
      } else {
        btn.className = 'glassmorphism bg-slate-800 border-slate-700 p-2.5 rounded-xl shadow-lg active:scale-95 transition-transform';
      }
    }

    function toggleDrawer() {
      state.drawerExpanded = !state.drawerExpanded;
      const list = document.getElementById('members-list');
      const icon = document.querySelector('#drawer-toggle-btn i');
      if (state.drawerExpanded) {
        list.classList.remove('max-h-48');
        list.classList.add('max-h-80');
        if (icon) icon.setAttribute('data-lucide', 'chevron-down');
      } else {
        list.classList.remove('max-h-80');
        list.classList.add('max-h-48');
        if (icon) icon.setAttribute('data-lucide', 'chevron-up');
      }
      initIcons();
      setTimeout(() => map.invalidateSize(), 200);
    }

    function shareInvite() {
      const url = new URL(window.location.href);
      url.searchParams.set('room', state.room);
      if (navigator.share) {
        navigator.share({
          title: 'Join Private Family Circle',
          text: `Join our private family tracker room: "${state.room}"`,
          url: url.toString()
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url.toString());
        alert("Invite link copied to clipboard!");
      }
    }

    function showError(msg) {
      document.getElementById('alert-text').innerText = msg;
      document.getElementById('alert-banner').classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('alert-banner').classList.add('hidden');
    }

    function openSettings() {
      document.getElementById('input-name').value = state.name;
      document.getElementById('input-room').value = state.room;
      document.getElementById('input-key').value = state.key;
      document.getElementById('setup-modal').classList.remove('hidden');
    }

    function saveSetup() {
      const name = document.getElementById('input-name').value.trim();
      const room = document.getElementById('input-room').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      const key = document.getElementById('input-key').value.trim();

      if (!name || !room || !key) {
        alert("Please provide your name, room name, and passphrase.");
        return;
      }

      state.name = name;
      state.room = room;
      state.key = key;

      localStorage.setItem('kin_name', name);
      localStorage.setItem('kin_room', room);
      localStorage.setItem('kin_key', key);

      document.getElementById('setup-modal').classList.add('hidden');
      initP2P();
      startGPS();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initIcons();
      initMap();

      const params = new URLSearchParams(window.location.search);
      if (params.get('room')) {
        document.getElementById('input-room').value = params.get('room');
      }

      if (state.name && state.room && state.key) {
        document.getElementById('setup-modal').classList.add('hidden');
        initP2P();
        startGPS();
      } else {
        document.getElementById('setup-modal').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
